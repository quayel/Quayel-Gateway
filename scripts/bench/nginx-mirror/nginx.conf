# Nginx mirror of quayel-gateway cache semantics for A/B benchmarking.
# Route policy (identical to config.json + cache.rs):
#   /cache-test        Quayel-CDN-Cache-Control: public s-maxage=3600 swr=3600 sie=3600
#                      -> edge TTL 3600s, stale-while-revalidate, stale-if-error
#   /cache-test-second public s-maxage=2 swr=5 sie=3600
#                      -> edge TTL 2s, stale-while-revalidate 5s, stale-if-error
#   /no-cache          no cache headers -> edge TTL 0 -> never cached, always proxied
# Cache key: scheme|host|path (gateway cache_key req.path, single host).
# ulimit 100000 to match the gateway's file-descriptor budget.

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 100000;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  16384;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nodelay     on;
    keepalive_timeout  75;
    access_log      off;              # gateway logging.enabled = false

    # Cache store (gateway: in-memory DashMap of full responses)
    proxy_cache_path /var/cache/nginx/quayel
                     levels=1:2
                     keys_zone=quayel_cache:64m
                     max_size=2g
                     inactive=1h
                     use_temp_path=off;

    # Upstream = exactly the gateway's load_balancer target
    upstream quayel_origin {
        server 94.136.185.15:4489;
        keepalive 128;
    }

    server {
        listen 8090;
        server_name _;

        # TTL is driven purely by per-route proxy_cache_valid, mirroring the
        # gateway's deterministic parse of Quayel-CDN-Cache-Control.
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
        proxy_cache quayel_cache;
        proxy_cache_key "$scheme$host$request_uri";

        # Singleflight behaviour = cache.rs revalidating lock
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_lock_age 5s;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;   # host_header mode: visitor

        # --- /cache-test: TTL 3600s, SWR 3600s, SIE 3600s ---
        location = /cache-test {
            proxy_cache_valid 200 301 404 3600s;
            proxy_cache_use_stale error timeout updating;
            proxy_cache_background_update on;
            proxy_cache_revalidate on;
            proxy_pass http://quayel_origin;
        }

        # --- /cache-test-second: TTL 2s, SWR 5s, SIE 3600s ---
        # nginx has no bounded SWR window; "use_stale updating" +
        # background_update serves stale while refreshing = the gateway's
        # SWR singleflight path. Documented approximation.
        location = /cache-test-second {
            proxy_cache_valid 200 301 404 2s;
            proxy_cache_use_stale error timeout updating;
            proxy_cache_background_update on;
            proxy_cache_revalidate on;
            proxy_pass http://quayel_origin;
        }

        # --- /no-cache: edge TTL 0 -> never stored, always proxied ---
        location = /no-cache {
            proxy_cache off;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            proxy_pass http://quayel_origin;
        }
    }
}